# =============== WIRING (reference) ===============
# Board: DFRobot FireBeetle 2 ESP32-C6 (esp32-c6-devkitc-1). Driver: 4-channel driver
# module with a shared enable/standby pin (EEP) for all 4 channels - exact model not
# yet confirmed (check silkscreen/datasheet if it has separate logic-VCC/output-VM
# pins instead of one combined supply pin).
#
# Control signals (board -> driver, logic level):
#   GPIO14 -> driver IN4 (PWM)  -> OUT4 -> Ambient-light LED string
#   GPIO15 -> driver IN2 (PWM)  -> OUT2 -> Outdoor-light LED string
#   GPIO6  -> driver EEP (enable/standby, shared across both channels)
#   GPIO3  -> driver IN1 (direction, outdoor channel), permanently LOW - see output: below
#   GPIO9  -> DevKit's BOOT button, to GND (hold 3s = WiFi reset)
#
# ASSUMPTION, NOT VERIFIED: driver IN3 is hardwired to GND (no GPIO needed, DC
# operation only needs one polarity per channel) - analogous to the original
# firmware (see AGENTS.md wiring reference). IN1 (the outdoor counterpart) is NOT
# tied to GND, but to GPIO3, permanently driven LOW (electrically identical to GND,
# but without needing a second free GND pad on the driver - both GND pads were
# already in use).
#
# Driver power supply (battery -> driver, NOT through the board):
#   Driver VCC/VM straight to the raw battery leads (a tap/splice on the battery
#   line, separate from the normal JST connection battery->board). NOT to VIN (charge
#   input only, no load output) or 3V3 (fixed 3.3V, would defeat the voltage
#   compensation in pwm_*_compensated, which assumes the real, sagging battery
#   voltage).
#
# Ground: shared across battery, board, and driver - otherwise the logic-level
# signals from the ESP have no valid reference at the driver.
#
# Battery measurement: GPIO0 (ADC1) reads the battery voltage through a voltage
# divider (currently assumed 2:1, see `multiply: 2.0` in sensor: below - not yet
# cross-checked with a multimeter).
#
# Caution at a full battery (4.2V) without the voltage compensation below: the
# driver is a plain switch, not a constant-voltage source - without compensation the
# full battery voltage would reach the LED string 1:1, which is only rated for
# 3.2-3.5V.

substitutions:
  battery_low_mv: "3050"      # Below this voltage: light(s) off
  battery_recover_mv: "3150"  # Above this voltage: light(s) allowed again
  battery_empty_mv: "3000"    # 0% reference
  battery_full_mv: "4200"     # 100% reference
  led_target_mv: "3500"       # Target voltage at the LED string (voltage compensation)

esphome:
  name: outdooresp32
  friendly_name: OutdoorESP32
  on_boot:
    priority: 600
    then:
      - switch.turn_off: driver_enable
      - output.turn_off: ledc_ambient
      - output.turn_off: ledc_outdoor
      - output.turn_off: outdoor_dir

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
  cpu_frequency: 80MHz
# Enable logging
logger:
  baud_rate: 115200
# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  version: 3

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Outdooresp Fallback Hotspot"
    password: !secret ap_password

captive_portal:

globals:
  - id: battery_mv
    type: int
    initial_value: "${battery_full_mv}"
  - id: low_battery
    type: bool
    initial_value: "false"

# =============== BATTERY ===============
sensor:
  # PIN_BAT / readBatteryMV(): the voltage divider halves the battery voltage 2:1
  # before the ADC, hence the *2 filter - not yet cross-checked with a multimeter,
  # same as in the original (see AGENTS.md follow-up "Re-check battery divider
  # calibration").
  - platform: adc
    pin: GPIO0
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    attenuation: 12db
    samples: 8   # BATTERY_SAMPLES - the original averages 8 ADC samples, that was missing here until now
    update_interval: 60s   # differs from the original (BATTERY_SYNC_MS = 5 min), here 1 min
    filters:
      - multiply: 2.0
    on_value:
      then:
        - lambda: |-
            int mv = (int)(x * 1000.0f);
            id(battery_mv) = mv;

            // Plausibility floor (2000 mV) before a deep-discharge protection trips:
            // a single ADC outlier/startup value near 0V shouldn't be mistaken for
            // "battery empty". Idea carried over from an earlier config of mine
            // (there implemented via x > 2.5 && x < 3.30).
            if (mv > 2000 && mv <= ${battery_low_mv}) {
              if (!id(low_battery)) {
                id(low_battery) = true;
                ESP_LOGW("battery", "Battery critical (%.2f V) - turning light(s) off!", x);
                auto call_a = id(ambient_light).turn_off();
                call_a.perform();
                auto call_o = id(outdoor_light).turn_off();
                call_o.perform();
              }
            } else if (mv <= 2000) {
              ESP_LOGW("battery", "Implausible reading (%.2f V) - check ADC/wiring. Deep-discharge protection NOT triggered.", x);
            } else if (mv >= ${battery_recover_mv}) {
              if (id(low_battery)) {
                id(low_battery) = false;
                ESP_LOGI("battery", "Battery recovered (%.2f V) - light(s) available again", x);
                // Same as the original: no auto re-enable, the user has to switch it back on manually.
              }
            }

            // Re-apply the voltage compensation (applyLight()) with the fresh
            // reading, if a light is currently on.
            if (id(ambient_light).current_values.is_on()) {
              id(ambient_light).turn_on().perform();
            }
            if (id(outdoor_light).current_values.is_on()) {
              id(outdoor_light).turn_on().perform();
            }

  # Replaces the original linear mvToPct() interpolation with a piecewise curve
  # that follows the real LiPo discharge curve (flat in the middle, steep near
  # empty) - exactly the open issue AGENTS.md flags under "linear .. not comparable
  # across the curve". The breakpoints are rule-of-thumb values for a 1S LiPo
  # between BATTERY_EMPTY_MV (3.00V) and BATTERY_FULL_MV (4.20V) - not
  # multimeter-verified, adjust with real measurement points from your own cell if
  # needed.
  # The `copy` platform (instead of a custom template + update_interval) is carried
  # over from an earlier config of mine - updates automatically with every new
  # battery_voltage value.
  - platform: copy
    source_id: battery_voltage
    name: "Battery Percentage"
    id: battery_percentage
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 3.00 -> 0
          - 3.30 -> 10
          - 3.50 -> 20
          - 3.65 -> 35
          - 3.75 -> 50
          - 3.85 -> 65
          - 3.95 -> 78
          - 4.05 -> 90
          - 4.20 -> 100
      - clamp:
          min_value: 0
          max_value: 100

# =============== DRIVER ENABLE (shared across both channels) ===============
# Corresponds to PIN_ENABLE/EEP: LOW = driver output stage (and its own quiescent
# draw) off. HIGH as soon as at least one light is on, LOW once both are off.
switch:
  - platform: gpio
    id: driver_enable
    pin: GPIO6
    internal: true
    restore_mode: ALWAYS_OFF

# =============== PWM OUTPUTS ===============
output:
  - platform: ledc
    id: ledc_ambient
    pin: GPIO14
    frequency: 20000 Hz   # PWM_FREQ
    zero_means_zero: true   # prevents a tiny residual duty cycle at 0% (carried over from an earlier config)
  - platform: ledc
    id: ledc_outdoor
    pin: GPIO15
    frequency: 20000 Hz
    zero_means_zero: true

  # Driver IN1 (direction, outdoor channel) - permanently LOW instead of hardwired to
  # GND, because both GND pads on the driver are already in use elsewhere. Only set
  # to LOW once at boot (see esphome.on_boot above) and never touched again after
  # that.
  - platform: gpio
    id: outdoor_dir
    pin: GPIO3

  # Voltage-compensated outputs, a counterpart to applyLight()'s
  # `duty = currentBrightness * voltageRatio` (voltageRatio = LED_TARGET_MV / lastBatteryMV,
  # capped at 100% - can't boost above the battery's own voltage).
  - platform: template
    id: pwm_ambient_compensated
    type: float
    write_action:
      - lambda: |-
          float ratio = (float)${led_target_mv} / (float) max(id(battery_mv), 1);
          if (ratio > 1.0f) ratio = 1.0f;
          id(ledc_ambient).set_level(state * ratio);
  - platform: template
    id: pwm_outdoor_compensated
    type: float
    write_action:
      - lambda: |-
          float ratio = (float)${led_target_mv} / (float) max(id(battery_mv), 1);
          if (ratio > 1.0f) ratio = 1.0f;
          id(ledc_outdoor).set_level(state * ratio);

# =============== LIGHTS ===============
# V0 (switch) + V1 (dimmer 0-100%) are a single dimmable light entity here - HA/the
# web UI deliver on/off and brightness through the same entity anyway.
light:
  - platform: monochromatic
    name: "Ambient Light"
    id: ambient_light
    output: pwm_ambient_compensated
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(low_battery);'
          then:
            - light.turn_off: ambient_light   # Deep-discharge protection: block turning on
          else:
            - switch.turn_on: driver_enable
    on_turn_off:
      - if:
          condition:
            and:
              - light.is_off: ambient_light
              - light.is_off: outdoor_light
          then:
            - switch.turn_off: driver_enable

  - platform: monochromatic
    name: "Outdoor Light"
    id: outdoor_light
    output: pwm_outdoor_compensated
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(low_battery);'
          then:
            - light.turn_off: outdoor_light   # Deep-discharge protection: block turning on
          else:
            - switch.turn_on: driver_enable
    on_turn_off:
      - if:
          condition:
            and:
              - light.is_off: ambient_light
              - light.is_off: outdoor_light
          then:
            - switch.turn_off: driver_enable

# =============== RESET BUTTON (BOOT button, PIN_RESET_BTN) ===============
# Holding for 3s erases the WiFi credentials and restarts - corresponds to
# checkResetButton() / WiFiManager::resetSettings() in main.cpp. GPIO9 is a boot
# strapping pin on the C6; that's fine as long as it's only pulled LOW (as here, via
# INPUT_PULLUP) during a deliberate manual hold, not permanently.
binary_sensor:
  - platform: gpio
    id: reset_button
    internal: true
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        - delay: 3s
        - if:
            condition:
              binary_sensor.is_on: reset_button
            then:
              - logger.log: "Reset: Erasing WiFi credentials, restarting..."
              - button.press: factory_reset_button

button:
  - platform: factory_reset
    id: factory_reset_button
    internal: true
  - platform: restart
    name: "Restart"

# =============== AUTOMATION: OUTDOOR LIGHT ===============
# Carried over from an earlier config of mine, deliberately only for Outdoor Light
# here (not Ambient Light) - fits the name/purpose ("outdoor", tied to dusk/dawn),
# while Ambient Light stays purely manual as before. Apply the same triggers to
# ambient_light too if needed.
#
# time: uses `sntp` here instead of `homeassistant` (as in the old config), so the
# schedule still works even without Home Assistant connected - matching the
# `web_server` above, which is explicitly meant to make the device usable standalone
# too.
time:
  - platform: sntp
    id: sntp_time
    on_time:
      - hours: 23
        minutes: 0
        seconds: 0
        then:
          - if:
              condition:
                light.is_on: outdoor_light
              then:
                - light.turn_on:
                    id: outdoor_light
                    brightness: 25%
                    transition_length: 30s
      - hours: 0
        minutes: 30
        seconds: 0
        then:
          - light.turn_off: outdoor_light

# Coordinates come from secrets.yaml (not in the repo, see secrets.yaml.example) -
# adjust if this is a different location.
sun:
  latitude: !secret location_latitude
  longitude: !secret location_longitude
  on_sunset:
    - elevation: -4°
      then:
        - if:
            condition:
              lambda: 'return !id(low_battery);'
            then:
              - light.turn_on:
                  id: outdoor_light
                  brightness: 70%
                  transition_length: 10s
  on_sunrise:
    - elevation: -4°
      then:
        - light.turn_off: outdoor_light
